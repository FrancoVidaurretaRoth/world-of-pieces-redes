# El reloj: los cron de GitHub no se disparan en este repo (04/11/2026: ni los de la publicación ni uno de prueba).
# Este workflow espera dormido hasta el próximo horario (como mucho 5 h 30, el tope de un trabajo es 6 h), lanza el
# workflow que toque y se vuelve a lanzar a sí mismo. Corre en GitHub, así que no depende de ninguna PC prendida.
# Un repo público no paga minutos de Actions. El GITHUB_TOKEN puede disparar workflow_dispatch (es la excepción
# a la regla de que un workflow no dispare otro).
#
# Horarios (UTC = Argentina + 3), los mismos que los cron de cada workflow:
#   publicar.yml  15:07, 17:37, 20:07, 22:37 y 01:07 todos los días (5 posts; redes.py frena duplicados)
#   resumen.yml   domingos 23:13
#   token.yml     días 1 y 15 a las 12:17
#
# Para arrancarlo (o si se cortó la cadena): Actions → Reloj → Run workflow (sin tildar la prueba). Si ya hay uno corriendo, el nuevo queda en
# espera y se descarta, así nunca hay dos relojes a la vez.
name: Reloj

on:
  workflow_dispatch:
    inputs:
      prueba:
        description: "Prueba: dormir 2 minutos y lanzar Verificar tokens (no publica)"
        type: boolean
        default: false
  schedule:
    # Por si GitHub algún día los dispara: revive la cadena si se cortó (si no, queda en espera y se descarta).
    - cron: "41 */4 * * *"

concurrency:
  group: reloj
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  esperar:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Calcular el próximo horario
        id: plan
        shell: python
        env:
          PRUEBA: ${{ inputs.prueba }}
        run: |
          import os
          from datetime import datetime, timedelta, timezone

          ahora = datetime.now(timezone.utc)
          eventos = []
          for d in range(0, 3):
              dia = (ahora + timedelta(days=d)).replace(second=0, microsecond=0)
              for h, m in [(15, 7), (17, 37), (20, 7), (22, 37), (1, 7)]:
                  eventos.append((dia.replace(hour=h, minute=m), "publicar.yml"))
              if dia.weekday() == 6:
                  eventos.append((dia.replace(hour=23, minute=13), "resumen.yml"))
              if dia.day in (1, 15):
                  eventos.append((dia.replace(hour=12, minute=17), "token.yml"))
          cuando, flujo = min((e for e in eventos if e[0] > ahora + timedelta(seconds=30)), key=lambda e: e[0])
          falta = (cuando - ahora).total_seconds()
          tope = 5.5 * 3600
          if falta > tope:
              falta, flujo = tope, ""
          if os.environ.get("PRUEBA") == "true":
              falta, flujo = 120, "verificar.yml"
          print(f"Próximo: {cuando:%Y-%m-%d %H:%M} UTC ({flujo or 'solo relevo'}), duermo {falta / 60:.0f} min")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"segundos={int(falta)}\nflujo={flujo}\n")
      - name: Dormir
        run: sleep ${{ steps.plan.outputs.segundos }}
      - name: Lanzar
        if: steps.plan.outputs.flujo != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ${{ steps.plan.outputs.flujo }} -R ${{ github.repository }}
      - name: Relevo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reloj.yml -R ${{ github.repository }}
